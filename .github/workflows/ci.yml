name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile-game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: element-simyasi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: element-simyasi/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Web export smoke test
        run: npx expo export --platform web --output-dir /tmp/expo-ci-dist
        env:
          EXPO_NO_TELEMETRY: '1'

  web-experience:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: element-simyasi-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: element-simyasi-web/package-lock.json
      - run: npm ci
      - run: npm run build
